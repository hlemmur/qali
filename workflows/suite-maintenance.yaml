version: 1
id: suite-maintenance
title: Suite maintenance
description: Diagnose suite reliability and propose policy-gated selector repairs.
executable: true
triggers:
  - type: command
    intent: maintain-suite
  - type: event
    event: suite-changed
preconditions: [project-exists, execution-unblocked, approved-scenario-present, test-suite-present]
steps:
  - id: diagnose
    role: suite-maintainer
    harnessProfileId: reliability-diagnosis
    needs: []
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: decisions
        path: projects/{projectId}/sources/decisions.md
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/approved
      - artifact: tests
        path: projects/{projectId}/tests
      - artifact: evidence
        path: projects/{projectId}/observations/evidence/test-runs
    outputs:
      - artifact: reports
        path: projects/{projectId}/derived/reports/reliability-diagnosis.md
    requiredTools: [file-read, file-write, report-renderer]
    mutations: [render-derived-report]
    policyGates: []
    retries: 0
    timeoutMs: 300000
  - id: repair-selectors
    role: suite-maintainer
    harnessProfileId: selector-repair
    needs: [diagnose]
    inputs:
      - artifact: decisions
        path: projects/{projectId}/sources/decisions.md
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/approved
      - artifact: tests
        path: projects/{projectId}/tests
      - artifact: reports
        path: projects/{projectId}/derived/reports/reliability-diagnosis.md
    outputs:
      - artifact: tests
        path: projects/{projectId}/tests
    requiredTools: [file-read, file-write]
    mutations: [modify-test]
    policyGates: [execution, approved-scenario]
    retries: 1
    timeoutMs: 600000
