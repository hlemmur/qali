version: 1
id: project-onboarding
title: Project onboarding
description: Establish governed project context, journeys, risks, and an initial QA plan.
executable: true
triggers:
  - type: command
    intent: onboard-project
preconditions: []
steps:
  - id: discover-project
    role: knowledge-curator
    harnessProfileId: onboarding-discovery
    needs: []
    inputs: []
    outputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference/discovery.md
      - artifact: questions
        path: projects/{projectId}/sources/questions.md
    requiredTools: [file-read, file-write]
    mutations: [format-document]
    policyGates: []
    retries: 1
    timeoutMs: 300000
  - id: discover-journeys
    role: knowledge-curator
    harnessProfileId: journey-discovery
    needs: [discover-project]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
    outputs:
      - artifact: reference
        path: projects/{projectId}/sources/reference/journeys.md
    requiredTools: [file-read, file-write]
    mutations: [format-document]
    policyGates: []
    retries: 0
    timeoutMs: 180000
  - id: assess-risks
    role: test-architect
    harnessProfileId: risk-assessment
    needs: [discover-journeys]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
    outputs:
      - artifact: reports
        path: projects/{projectId}/derived/reports/risk-assessment.md
    requiredTools: [file-read, file-write, report-renderer]
    mutations: [format-document]
    policyGates: []
    retries: 0
    timeoutMs: 300000
  - id: plan-strategy
    role: test-architect
    harnessProfileId: strategy-initial-plan
    needs: [assess-risks]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
    outputs:
      - artifact: strategy
        path: projects/{projectId}/derived/strategy.md
      - artifact: plan
        path: projects/{projectId}/derived/plan.md
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/smoke-proposal.md
      - artifact: reports
        path: projects/{projectId}/derived/reports/initial-test-plan.md
    requiredTools: [file-read, file-write, report-renderer]
    mutations: [format-document]
    policyGates: []
    retries: 0
    timeoutMs: 300000
  - id: first-explore
    role: explorer
    harnessProfileId: browser-exploration
    needs: [plan-strategy]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
    outputs:
      - artifact: exploration
        path: projects/{projectId}/observations/exploration.md
      - artifact: evidence
        path: projects/{projectId}/observations/evidence/exploration
    requiredTools: [file-read, file-write, browser]
    mutations: [append-observation, append-evidence]
    policyGates: []
    retries: 0
    timeoutMs: 300000
  - id: first-explore-report
    role: reporter
    harnessProfileId: human-reporting
    needs: [first-explore]
    inputs:
      - artifact: evidence
        path: projects/{projectId}/observations/evidence/exploration
      - artifact: exploration
        path: projects/{projectId}/observations/exploration.md
      - artifact: questions
        path: projects/{projectId}/sources/questions.md
    outputs:
      - artifact: reports
        path: projects/{projectId}/derived/reports/exploration.md
    requiredTools: [file-read, file-write, report-renderer]
    mutations: [render-derived-report]
    policyGates: []
    retries: 0
    timeoutMs: 120000
  - id: seed-schedule
    role: quality-analyst
    harnessProfileId: host-schedule-maintenance
    needs: [first-explore-report]
    inputs:
      - artifact: workflow-state
        path: projects/{projectId}/derived/workflow-state
    outputs:
      - artifact: workflow-state
        path: projects/{projectId}/derived/workflow-state/schedule.yaml
    requiredTools: []
    mutations: [format-document]
    policyGates: []
    retries: 0
    timeoutMs: 30000
