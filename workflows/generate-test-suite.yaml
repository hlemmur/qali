version: 1
id: generate-test-suite
title: Generate test suite
description: Design approved scenarios and generate deterministic Playwright tests.
executable: true
triggers:
  - type: command
    intent: generate-test-suite
preconditions: [project-exists, project-context-present, execution-unblocked]
steps:
  - id: design-coverage
    role: test-architect
    harnessProfileId: coverage-design
    needs: []
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
      - artifact: decisions
        path: projects/{projectId}/sources/decisions.md
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/approved
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/proposed
      - artifact: reports
        path: projects/{projectId}/derived/reports/exploration.md
      - artifact: reports
        path: projects/{projectId}/derived/reports/exploration.json
    outputs:
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/coverage-map.md
    requiredTools: [file-read, file-write]
    mutations: [format-document]
    policyGates: []
    retries: 0
    timeoutMs: 180000
  - id: generate-tests
    role: test-generator
    harnessProfileId: test-generation
    needs: [design-coverage]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
      - artifact: decisions
        path: projects/{projectId}/sources/decisions.md
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/approved
      - artifact: scenarios
        path: projects/{projectId}/derived/scenarios/proposed
      - artifact: reports
        path: projects/{projectId}/derived/reports/exploration.md
    outputs:
      - artifact: tests
        path: projects/{projectId}/tests
    requiredTools: [file-read, file-write]
    mutations: [create-test]
    policyGates: [execution]
    retries: 1
    timeoutMs: 900000
