version: 1
id: exploratory-testing
title: Exploratory testing
description: Run bounded exploration and preserve observations and evidence.
executable: true
triggers:
  - type: command
    intent: explore-project
preconditions: [project-exists, project-context-present]
steps:
  - id: charter
    role: explorer
    harnessProfileId: exploration-charter
    needs: []
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
      - artifact: known-issues
        path: projects/{projectId}/observations/known-issues.md
    outputs:
      - artifact: exploration
        path: projects/{projectId}/observations/exploration.md
    requiredTools: [file-read, file-write]
    mutations: [append-observation]
    policyGates: []
    retries: 0
    timeoutMs: 120000
  - id: explore
    role: explorer
    harnessProfileId: browser-exploration
    needs: [charter]
    inputs:
      - artifact: project-context
        path: projects/{projectId}/sources/project-context.md
      - artifact: reference
        path: projects/{projectId}/sources/reference
      - artifact: known-issues
        path: projects/{projectId}/observations/known-issues.md
    outputs:
      - artifact: evidence
        path: projects/{projectId}/observations/evidence/exploration
      - artifact: exploration
        path: projects/{projectId}/observations/exploration.md
      - artifact: questions
        path: projects/{projectId}/sources/questions.md
    requiredTools: [file-read, file-write, browser]
    mutations: [append-observation, append-evidence]
    policyGates: []
    retries: 0
    timeoutMs: 3600000
  - id: report
    role: reporter
    harnessProfileId: human-reporting
    needs: [explore]
    inputs:
      - artifact: evidence
        path: projects/{projectId}/observations/evidence/exploration
      - artifact: exploration
        path: projects/{projectId}/observations/exploration.md
      - artifact: questions
        path: projects/{projectId}/sources/questions.md
    outputs:
      - artifact: reports
        path: projects/{projectId}/derived/reports/exploration.md
    requiredTools: [file-read, file-write, report-renderer]
    mutations: [render-derived-report]
    policyGates: []
    retries: 0
    timeoutMs: 120000
