name: Qualify Qali agent runtime

on:
  workflow_dispatch:
    inputs:
      model:
        description: Cursor model identifier to qualify
        required: false
        default: composer-2.5
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      CURSOR_AGENT_VERSION: 2026.08.11-e8db854
      CURSOR_INSTALLER_SHA256: b1af27b9556c5f1c58d166742dbb33425ebd90a4bbd7e5453d66b920bf1f9f6b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Install Cursor Agent CLI
        run: |
          curl https://cursor.com/install -fsS -o cursor-install.sh
          echo "$CURSOR_INSTALLER_SHA256  cursor-install.sh" | sha256sum --check
          bash cursor-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          command -v agent
          readlink -f "$(command -v agent)" | grep -F "/versions/$CURSOR_AGENT_VERSION/"
          agent --version
      - name: Run qualification evaluation suite
        env:
          CURSOR_MODEL: ${{ inputs.model || vars.CURSOR_MODEL }}
          QALI_QUALIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run qualify
      - name: Upload qualification record
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qali-qualification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            qualification/candidate-record.json
            qualification/evaluation-suite.json
