name: Execute Qali workflow
run-name: Qali ${{ inputs.intent || 'scheduled' }} · ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Control-plane request identifier
        required: true
        type: string
      correlation_json:
        description: Serialized Slack correlation context
        required: true
        default: '{}'
        type: string
      project_json:
        description: Serialized project metadata
        required: true
        type: string
      intent:
        description: Normalized Qali intent
        required: true
        type: string
      parameters_json:
        description: Serialized command parameters
        required: true
        default: '{}'
        type: string
      command_json:
        description: Complete normalized command from the control plane
        required: true
        type: string
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  validate-and-execute:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.project_json && fromJSON(inputs.project_json).environment || 'qali-sauce-demo' }}
    timeout-minutes: 30
    env:
      CI: 'true'
      QALI_TARGET_BASE_URL: ${{ vars.QALI_TARGET_BASE_URL }}
      QALI_ALLOWED_ORIGINS_JSON: ${{ vars.QALI_ALLOWED_ORIGINS_JSON }}
      QALI_TEST_CREDENTIALS_JSON: ${{ secrets.QALI_TEST_CREDENTIALS_JSON }}
      QALI_TEST_DATA_JSON: ${{ vars.QALI_TEST_DATA_JSON }}
      CURSOR_AGENT_VERSION: 2026.08.11-e8db854
      CURSOR_INSTALLER_SHA256: b1af27b9556c5f1c58d166742dbb33425ebd90a4bbd7e5453d66b920bf1f9f6b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'workflow_dispatch' || inputs.intent != 'query-project'
      - name: Install Cursor Agent CLI
        if: github.event_name == 'workflow_dispatch' && vars.CURSOR_MODEL != '' && inputs.intent != 'query-project'
        run: |
          curl https://cursor.com/install -fsS -o cursor-install.sh
          echo "$CURSOR_INSTALLER_SHA256  cursor-install.sh" | sha256sum --check
          bash cursor-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          command -v agent
          readlink -f "$(command -v agent)" | grep -F "/versions/$CURSOR_AGENT_VERSION/"
          agent --version
      - name: Validate repository and policy
        if: github.event_name != 'workflow_dispatch' || inputs.intent != 'query-project'
        run: npm run check
      - name: Execute requested workflow
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMAND_JSON: ${{ inputs.command_json }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          QALI_CURSOR_FAILOVER_MODELS_JSON: ${{ vars.QALI_CURSOR_FAILOVER_MODELS_JSON }}
          CURSOR_SANDBOX: disabled
        run: |
          if [ -n "${CURSOR_MODEL:-}" ] && [ -n "${CURSOR_API_KEY:-}" ] && command -v agent >/dev/null; then
            echo "Qali agent runtime available (model=${CURSOR_MODEL}); qualification policy will decide execution"
          else
            echo "Qali agent runtime unavailable; only explicit Mock Mode may use deterministic fallback"
          fi
          npm run execute
      - name: Validate generated state
        if: github.event_name == 'workflow_dispatch' && inputs.intent != 'query-project'
        env:
          PROJECT_JSON: ${{ inputs.project_json }}
        run: |
          PROJECT_ROOT="$(node -e 'const p=JSON.parse(process.env.PROJECT_JSON); process.stdout.write(p.root)')"
          # Live Cursor Agent may write markdown that is not Prettier-clean yet.
          npx prettier --write "$PROJECT_ROOT"
          # Do not re-run unit tests against a mutated demo fixture; policy already checked pre-execute.
          npm run format:check
          npm run lint
          npm run build
          npm run project:validate -- --refresh "$PROJECT_ROOT"
      - name: Prepare controlled publication bundle
        if: github.event_name == 'workflow_dispatch' && inputs.intent != 'query-project'
        env:
          QALI_REQUEST_ID: ${{ inputs.request_id }}
          PROJECT_JSON: ${{ inputs.project_json }}
          COMMAND_JSON: ${{ inputs.command_json }}
        run: |
          mkdir -p .qali
          git diff --binary > .qali/generated.patch
          npm run publish:prepare
      - name: Run scheduled quality pulse through the production orchestrator
        if: github.event_name == 'schedule'
        env:
          QALI_SCHEDULE_REQUEST_ID: scheduled-quality-pulse-${{ github.run_id }}
        run: |
          COMMAND_JSON="$(node --import tsx scripts/scheduled-quality-pulse.ts)"
          export COMMAND_JSON
          npm run execute
      - name: Write job summary
        if: always()
        env:
          SUMMARY_REQUEST_ID: ${{ inputs.request_id || format('scheduled-quality-pulse-{0}', github.run_id) }}
          SUMMARY_INTENT: ${{ inputs.intent || 'quality-pulse' }}
          SUMMARY_PROJECT: ${{ inputs.project_json || '{"id":"sauce-demo"}' }}
        run: |
          {
            echo "## Qali execution"
            printf '%s\n' "- Request: \`$SUMMARY_REQUEST_ID\`"
            printf '%s\n' "- Intent: \`$SUMMARY_INTENT\`"
            printf '%s\n' "- Project: \`$SUMMARY_PROJECT\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f playwright-report/index.html ]; then
            echo "- Playwright HTML report: uploaded in this run's artifact under \`playwright-report/\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Playwright and workflow evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qali-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            projects/${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.project_json).id || 'sauce-demo' }}/observations/evidence/
            projects/${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.project_json).id || 'sauce-demo' }}/derived/reports/
            projects/${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.project_json).id || 'sauce-demo' }}/derived/workflow-state/
            .qali/generated.patch
            .qali/publication-request.json
            .qali/slack-summary.json
            .qali/quality-snapshot.json
            .qali/agent-mode.json
            .qali/report.html

  publish-generated-changes:
    if: github.event_name == 'workflow_dispatch' && inputs.intent != 'query-project' && needs.validate-and-execute.result == 'success'
    needs: validate-and-execute
    environment: qali-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QALI_PUBLISH_GITHUB_TOKEN: ${{ secrets.QALI_PUBLISH_GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qali-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-artifact
      - name: Publish through Qali GitHub App
        if: env.QALI_PUBLISH_GITHUB_TOKEN != ''
        env:
          QALI_PUBLICATION_MANIFEST: publication-artifact/.qali/publication-request.json
        run: npm run publish
      - name: Keep patch artifact when publication is not configured
        if: env.QALI_PUBLISH_GITHUB_TOKEN == ''
        run: echo "QALI_PUBLISH_GITHUB_TOKEN is not configured; generated.patch remains an artifact."

  notify-slack:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [validate-and-execute, publish-generated-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Download workflow evidence when available
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qali-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Post final Slack run summary
        env:
          QALI_WORKER_BASE_URL: ${{ vars.QALI_WORKER_BASE_URL }}
          QALI_CALLBACK_SECRET: ${{ secrets.QALI_CALLBACK_SECRET }}
          SUMMARY_REQUEST_ID: ${{ inputs.request_id }}
          SUMMARY_INTENT: ${{ inputs.intent }}
          PROJECT_JSON: ${{ inputs.project_json }}
          JOB_STATUS: ${{ (needs.validate-and-execute.result != 'success' || needs.publish-generated-changes.result == 'failure' || needs.publish-generated-changes.result == 'cancelled') && 'failure' || 'success' }}
          EXECUTE_RESULT: ${{ needs.validate-and-execute.result }}
          PUBLISH_RESULT: ${{ needs.publish-generated-changes.result }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run post:run-summary
